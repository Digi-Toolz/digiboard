<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ruhiger, grafischer Klassenbaum">
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6753c"/>
      <stop offset=".55" stop-color="#8c542b"/>
      <stop offset="1" stop-color="#70401f"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9df47"/>
      <stop offset="1" stop-color="#6bbb37"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83cf40"/>
      <stop offset="1" stop-color="#4ca333"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#2f702c" flood-opacity=".18"/>
    </filter>
  </defs>

  <ellipse cx="600" cy="706" rx="248" ry="24" fill="#2f7b31" opacity=".14"/>

  <!-- Große, ruhige Blattgruppen statt einzelner Blätter. -->
  <g filter="url(#shadow)">
    <circle cx="342" cy="286" r="146" fill="url(#leafB)"/>
    <circle cx="475" cy="198" r="158" fill="url(#leafA)"/>
    <circle cx="642" cy="180" r="170" fill="url(#leafB)"/>
    <circle cx="808" cy="224" r="154" fill="url(#leafA)"/>
    <circle cx="914" cy="337" r="145" fill="url(#leafB)"/>
    <circle cx="805" cy="402" r="168" fill="#55ad35"/>
    <circle cx="622" cy="414" r="176" fill="#62b83a"/>
    <circle cx="438" cy="410" r="166" fill="#58ac34"/>
    <circle cx="286" cy="384" r="140" fill="#4da032"/>
  </g>

  <!-- Wenige breite Äste sorgen für Struktur, ohne kleinteilig zu werden. -->
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 690 C587 575 591 460 603 332" stroke-width="116"/>
    <path d="M585 500 C520 423 452 365 342 318" stroke-width="56"/>
    <path d="M616 492 C683 414 760 356 870 315" stroke-width="56"/>
    <path d="M588 420 C538 347 494 294 431 248" stroke-width="42"/>
    <path d="M615 414 C666 342 712 288 778 244" stroke-width="42"/>
  </g>
  <path d="M548 700 C563 576 570 447 587 336 C596 285 607 285 617 336 C636 451 643 578 657 700 Z" fill="url(#trunk)"/>
  <path d="M585 671 C593 548 594 438 601 346" fill="none" stroke="#d18b4b" stroke-width="12" stroke-linecap="round" opacity=".38"/>

  <!-- Vordere Kronenflächen verbinden Baum und Äste zu einer klaren Silhouette. -->
  <g>
    <circle cx="377" cy="330" r="112" fill="#72bf38"/>
    <circle cx="510" cy="289" r="124" fill="url(#leafA)"/>
    <circle cx="688" cy="287" r="126" fill="#77c53c"/>
    <circle cx="826" cy="338" r="112" fill="#68b737"/>
    <ellipse cx="500" cy="418" rx="142" ry="105" fill="#4fa333"/>
    <ellipse cx="700" cy="418" rx="142" ry="105" fill="#57ab35"/>
  </g>

  <!-- Der Stamm liegt bewusst klar vor der Krone: Orientierung statt Blattgewimmel. -->
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 690 C587 575 591 460 603 332" stroke-width="108"/>
    <path d="M585 500 C520 423 452 365 342 318" stroke-width="50"/>
    <path d="M616 492 C683 414 760 356 870 315" stroke-width="50"/>
    <path d="M588 420 C538 347 494 294 431 248" stroke-width="37"/>
    <path d="M615 414 C666 342 712 288 778 244" stroke-width="37"/>
  </g>
  <path d="M552 700 C566 576 572 447 588 336 C596 289 607 289 616 336 C634 451 641 578 654 700 Z" fill="url(#trunk)"/>
  <path d="M587 671 C594 548 595 438 601 346" fill="none" stroke="#d18b4b" stroke-width="11" stroke-linecap="round" opacity=".36"/>

  <!-- Drei große Lichtinseln genügen für Frische auf der Prowise-Tafel. -->
  <g fill="#c3ec64" opacity=".58">
    <ellipse cx="472" cy="185" rx="74" ry="46"/>
    <ellipse cx="654" cy="148" rx="84" ry="49"/>
    <ellipse cx="809" cy="223" rx="70" ry="43"/>
  </g>
</svg>
